name: Publica els apunts

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Descarrega el repositori
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la Zensical
        run: pip install -r requirements.txt

      - name: Construeix el lloc
        run: zensical build --clean

      - name: Puja l'artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplega a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
